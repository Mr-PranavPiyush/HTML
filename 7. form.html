<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms example</title>
</head>
<body>
    <p>Registration Form</p>
    <form>
    <fieldset>
        <legend>User personal information</legend>
        <label>Enter your Fullname</label><br>
        <input type="text"><br><br>
        <label> Enter your Email</label><br>
        <input type="email"><br><br>
        <label>Enter your password</label><br>
        <input type="password"><br>
        <label>Confirm your password</label>
        <br>
        <input type="password"><br><br>
        <label>Enter your gender</label><br>
        <input type="radio"> Male<br>
        <input type="radio"> Female<br>
        <input type="radio"> Others<br>
        <label>Enter your address:</label>
        <textarea>Enter your address</textarea><br>
        <input type="submit" value="Signup">
        </fieldset>
    </form>
    <iframe src="lists.html" height="400" width="400" title="Iframe Example"></iframe>
</body>
</html>
